server.port=${PORT:8080}

# Database Configuration (MySQL with env var overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/civicconnect?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aditya123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Multipart File Uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Application Specific Configurations
app.jwt.secret=${JWT_SECRET:civicconnect_super_secure_jwt_secret_key_2026_at_least_256_bits_long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.upload.dir=${FILE_UPLOAD_DIR:./uploads}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Secure First-Admin Bootstrap (Only created once if configured and no admin exists)
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin@civicconnect.gov.in}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:Admin@1234}
app.admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:Municipal Administrator}
